<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Web Player</title>
  <style>
    :root { --bg: #0f0f0f; --card-bg: #1f1f1f; --text: #f1f1f1; --muted: #aaaaaa; --border: #303030; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Roboto, Arial, sans-serif; background-color: var(--bg); color: var(--text); }
    
    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .logo span { background: red; color: white; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    
    .search-form { display: flex; flex: 1; max-width: 500px; margin: 0 16px; }
    .search-form input { flex: 1; padding: 10px 14px; background: #121212; border: 1px solid var(--border); border-radius: 20px 0 0 20px; color: #fff; outline: none; }
    .search-form button { padding: 10px 18px; background: #222; border: 1px solid var(--border); border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer; }

    /* Layout Containers */
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    #loader { text-align: center; padding: 40px; color: var(--muted); display: none; }

    /* Search Results Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .video-card { display: flex; flex-direction: column; cursor: pointer; border-radius: 8px; overflow: hidden; background: transparent; transition: transform 0.2s; }
    .video-card:hover { transform: translateY(-3px); }
    .thumb-box { width: 100%; aspect-ratio: 16/9; background: #222; overflow: hidden; border-radius: 8px; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px 0; }
    .card-title { font-size: 14px; font-weight: 600; margin: 0 0 6px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .card-meta { font-size: 12px; color: var(--muted); margin: 0; }

    /* Watch Page Layout */
    #watchView { display: none; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) {
      #watchView { grid-template-columns: 1fr 350px; }
    }

    /* Player & Video Details */
    .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    
    .video-details { margin-top: 16px; margin-bottom: 24px; }
    .video-details h1 { font-size: 18px; margin: 0; }

    /* Related Sidebar */
    .related-title { font-size: 16px; margin: 0 0 12px 0; }
    .related-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .related-thumb { width: 120px; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; background: #222; flex-shrink: 0; }
    .related-info { display: flex; flex-direction: column; justify-content: center; }
    .related-info h4 { font-size: 12px; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .related-info p { font-size: 11px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showSearchPage()">YT <span>STREAM</span></div>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Cari video..." required>
      <button type="submit">Cari</button>
    </form>
  </header>

  <main>
    <div id="loader">Memuat data...</div>

    <div id="searchView">
      <div class="grid" id="videoGrid"></div>
    </div>

    <div id="watchView">
      <div class="main-player-col">
        <div class="player-container">
          <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="video-details">
          <h1 id="vTitle">Memutar Video...</h1>
        </div>
      </div>

      <div class="sidebar-col">
        <h3 class="related-title">Video Terkait</h3>
        <div id="relatedList"></div>
      </div>
    </div>
  </main>

  <script>
    const searchView = document.getElementById('searchView');
    const watchView = document.getElementById('watchView');
    const loader = document.getElementById('loader');
    const videoGrid = document.getElementById('videoGrid');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');

    // Tampilkan Halaman Pencarian
    function showSearchPage() {
      watchView.style.display = 'none';
      searchView.style.display = 'block';
      document.getElementById('videoPlayer').src = ''; // Stop player
    }

    // Search Video
    async function searchVideos(query) {
      showSearchPage();
      videoGrid.innerHTML = '';
      loader.style.display = 'block';

      try {
        const res = await fetch(`/api/yt?action=search&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        loader.style.display = 'none';

        if (data.results) {
          data.results.forEach(item => {
            if (item.type !== 'video' || !item.id) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            // Passing ID dan Title ke fungsi playVideo
            card.onclick = () => playVideo(item.id, item.title);
            card.innerHTML = `
              <div class="thumb-box"><img src="${item.thumbnail}" loading="lazy"></div>
              <div class="card-info">
                <h3 class="card-title">${item.title}</h3>
                <p class="card-meta">${item.channel || ''} • ${item.views || ''}</p>
              </div>
            `;
            videoGrid.appendChild(card);
          });
        }
      } catch (err) {
        loader.style.display = 'none';
        alert("Gagal memuat video: " + err.message);
      }
    }

    // Putar Video dan Tampilkan Halaman Tonton
    function playVideo(videoId, title) {
      searchView.style.display = 'none';
      watchView.style.display = 'grid';
      window.scrollTo(0, 0);

      // Set judul secara instan dari data klik
      document.getElementById('vTitle').innerText = title || "Sedang Memutar...";
      document.getElementById('relatedList').innerHTML = "";

      // 1. Putar Video via Player Embed
      document.getElementById('videoPlayer').src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;

      // 2. Ambil Video Terkait (action=related)
      fetch(`/api/yt?action=related&id=${videoId}`)
        .then(r => r.json())
        .then(data => {
          const relatedContainer = document.getElementById('relatedList');
          if (data.results) {
            data.results.forEach(item => {
              if (item.type !== 'video' || !item.id) return;
              const rel = document.createElement('div');
              rel.className = 'related-item';
              // Passing ID dan Title dari list terkait
              rel.onclick = () => playVideo(item.id, item.title);
              rel.innerHTML = `
                <img class="related-thumb" src="${item.thumbnail}" loading="lazy">
                <div class="related-info">
                  <h4>${item.title}</h4>
                  <p>${item.channel || ''}</p>
                  <p>${item.views || ''}</p>
                </div>
              `;
              relatedContainer.appendChild(rel);
            });
          }
        }).catch(e => console.error("Gagal memuat video terkait:", e));
    }

    // Submit pencarian
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      searchVideos(searchInput.value);
    });

    // Jalankan pencarian awal
    window.onload = () => searchVideos('musik indonesia terbaru');
  </script>
</body>
</html>
