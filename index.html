<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Web Player</title>
  <style>
    :root { --bg: #0f0f0f; --card-bg: #1f1f1f; --text: #f1f1f1; --muted: #aaaaaa; --border: #303030; --red: #ff0000; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Roboto, Arial, sans-serif; background-color: var(--bg); color: var(--text); overflow-y: scroll; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .logo span { background: var(--red); color: white; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    
    .nav-tabs { display: flex; gap: 16px; margin-left: 20px; }
    .nav-tab { cursor: pointer; padding: 6px 12px; border-radius: 16px; background: #222; font-size: 14px; font-weight: 500; transition: 0.2s; }
    .nav-tab.active { background: var(--text); color: var(--bg); }

    .search-form { display: flex; flex: 1; max-width: 400px; margin: 0 16px; justify-content: flex-end; }
    .search-form input { width: 100%; max-width: 300px; padding: 8px 14px; background: #121212; border: 1px solid var(--border); border-radius: 20px 0 0 20px; color: #fff; outline: none; }
    .search-form button { padding: 8px 16px; background: #222; border: 1px solid var(--border); border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer; }

    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .grid-shorts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    
    .video-card { display: flex; flex-direction: column; cursor: pointer; border-radius: 8px; background: transparent; transition: transform 0.2s; }
    .video-card:hover { transform: translateY(-3px); }
    .thumb-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #222; overflow: hidden; border-radius: 8px; }
    .thumb-box.short-ratio { aspect-ratio: 9/16; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .duration-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; font-size: 11px; font-weight: 500; padding: 3px 6px; border-radius: 4px; line-height: 1; }
    
    .card-info { padding: 10px 0; }
    .card-title { font-size: 14px; font-weight: 600; margin: 0 0 6px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .card-meta { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.4; }

    #watchView { display: none; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) { #watchView { grid-template-columns: 1fr 350px; display: grid; } }
    
    /* Perbaikan Container Player */
    .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    
    .video-details { margin-top: 16px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px;}
    .video-details h1 { font-size: 18px; margin: 0; }
    
    .controls-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); }
    .switch-wrap { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500;}
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--red); }
    input:checked + .slider:before { transform: translateX(20px); }
    .mode-label { color: var(--muted); }
    input:checked ~ .mode-label { color: #fff; font-weight: bold; }

    .related-title { font-size: 16px; margin: 0 0 12px 0; }
    .related-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .related-thumb-box { position: relative; width: 140px; aspect-ratio: 16/9; flex-shrink: 0; background: #222; border-radius: 6px; overflow: hidden; }
    .related-info { display: flex; flex-direction: column; justify-content: center; }
    .related-info h4 { font-size: 13px; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;}
    .related-info p { font-size: 11px; color: var(--muted); margin: 0; line-height: 1.4; }

    @keyframes pulse { 0% { background-color: #2a2a2a; } 50% { background-color: #3f3f3f; } 100% { background-color: #2a2a2a; } }
    .skeleton-box { animation: pulse 1.5s infinite ease-in-out; }
    .skeleton-text { height: 12px; margin-top: 8px; border-radius: 4px; animation: pulse 1.5s infinite ease-in-out; }
    .skeleton-title { width: 90%; height: 16px; }
    .skeleton-meta { width: 60%; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center;">
      <div class="logo" onclick="switchTab('search')">YT <span>STREAM</span></div>
      <div class="nav-tabs">
        <div class="nav-tab active" id="tabSearch" onclick="switchTab('search')">Beranda</div>
        <div class="nav-tab" id="tabShorts" onclick="switchTab('shorts')">Shorts</div>
      </div>
    </div>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Cari video..." required>
      <button type="submit">Cari</button>
    </form>
  </header>

  <main>
    <div id="searchView" class="view-section active">
      <div class="grid" id="videoGrid"></div>
    </div>

    <div id="shortsView" class="view-section">
      <div class="grid-shorts" id="shortsGrid"></div>
    </div>

    <div id="watchView" class="view-section">
      <div class="main-player-col">
        <div class="player-container">
          <!-- Menggunakan Iframe murni, bebas lag dan bebas black screen -->
          <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="video-details">
          <h1 id="vTitle">Memutar Video...</h1>
          <div class="controls-row">
            <span style="font-size: 14px; color: var(--muted);">Ulangi Video Ini Terus (Loop)</span>
            <div class="switch-wrap">
              <label class="switch">
                <input type="checkbox" id="loopToggle" onchange="toggleLoop()">
                <span class="slider"></span>
              </label>
              <span class="mode-label">Aktifkan Loop</span>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-col">
        <h3 class="related-title">Video Terkait</h3>
        <div id="relatedList"></div>
      </div>
    </div>
  </main>

  <script>
    const searchView = document.getElementById('searchView');
    const shortsView = document.getElementById('shortsView');
    const watchView = document.getElementById('watchView');
    const videoGrid = document.getElementById('videoGrid');
    const shortsGrid = document.getElementById('shortsGrid');
    const videoPlayer = document.getElementById('videoPlayer');
    
    let currentVideoId = "";

    function showSkeleton(container, type, count = 12) {
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        container.innerHTML += `
          <div class="video-card">
            <div class="thumb-box skeleton-box ${type === 'short' ? 'short-ratio' : ''}"></div>
            <div class="card-info">
              <div class="skeleton-text skeleton-title"></div>
              <div class="skeleton-text skeleton-meta"></div>
            </div>
          </div>
        `;
      }
    }

    function switchTab(tab) {
      document.getElementById('tabSearch').classList.remove('active');
      document.getElementById('tabShorts').classList.remove('active');
      
      searchView.classList.remove('active');
      shortsView.classList.remove('active');
      watchView.classList.remove('active');
      
      videoPlayer.src = ""; // Matikan video saat pindah tab

      if (tab === 'search') {
        document.getElementById('tabSearch').classList.add('active');
        searchView.classList.add('active');
        if (videoGrid.innerHTML === '') searchVideos('Musik pop indonesia terbaru');
      } else if (tab === 'shorts') {
        document.getElementById('tabShorts').classList.add('active');
        shortsView.classList.add('active');
        if (shortsGrid.innerHTML === '') loadShorts();
      }
    }

    async function searchVideos(query) {
      switchTab('search');
      showSkeleton(videoGrid, 'video');

      try {
        const res = await fetch(`/api/yt?action=search&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        videoGrid.innerHTML = '';

        if (data.results && data.results.length > 0) {
          data.results.forEach(item => {
            if (item.type !== 'video' || !item.id) return;
            const timeText = item.publishTime ? ` • ${item.publishTime}` : '';
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => playVideo(item.id, item.title);
            card.innerHTML = `
              <div class="thumb-box">
                <img src="${item.thumbnail}" loading="lazy">
                ${item.duration ? `<span class="duration-badge">${item.duration}</span>` : ''}
              </div>
              <div class="card-info">
                <h3 class="card-title">${item.title}</h3>
                <p class="card-meta">${item.channel || ''}<br>${item.views || ''}${timeText}</p>
              </div>
            `;
            videoGrid.appendChild(card);
          });
        } else {
          videoGrid.innerHTML = '<p>Video tidak ditemukan.</p>';
        }
      } catch (err) {
        videoGrid.innerHTML = '<p>Gagal memuat video.</p>';
      }
    }

    async function loadShorts() {
      showSkeleton(shortsGrid, 'short');
      try {
        const res = await fetch(`/api/yt?action=shorts`);
        const data = await res.json();
        shortsGrid.innerHTML = '';

        if (data.results && data.results.length > 0) {
          data.results.forEach(item => {
            if (!item.id) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => playVideo(item.id, item.title);
            card.innerHTML = `
              <div class="thumb-box short-ratio"><img src="${item.thumbnail}" loading="lazy"></div>
              <div class="card-info">
                <h3 class="card-title">${item.title}</h3>
                <p class="card-meta">${item.views || ''}</p>
              </div>
            `;
            shortsGrid.appendChild(card);
          });
        } else {
          shortsGrid.innerHTML = '<p>Gagal memuat Shorts. Coba lagi.</p>';
        }
      } catch (err) {
        shortsGrid.innerHTML = '<p>Gagal memuat Shorts.</p>';
      }
    }

    function playVideo(videoId, title) {
      document.getElementById('tabSearch').classList.remove('active');
      document.getElementById('tabShorts').classList.remove('active');
      
      searchView.classList.remove('active');
      shortsView.classList.remove('active');
      watchView.classList.add('active');
      window.scrollTo(0, 0);

      currentVideoId = videoId;
      document.getElementById('vTitle').innerText = title || "Sedang Memutar...";
      
      // Matikan toggle loop saat video baru diputar
      document.getElementById('loopToggle').checked = false;
      setPlayerUrl();

      // Ambil Video Terkait
      document.getElementById('relatedList').innerHTML = '<p style="color:var(--muted)">Memuat...</p>';

      fetch(`/api/yt?action=related&id=${videoId}`)
        .then(r => r.json())
        .then(data => {
          const relatedContainer = document.getElementById('relatedList');
          relatedContainer.innerHTML = '';
          if (data.results && data.results.length > 0) {
            data.results.forEach(item => {
              if (item.type !== 'video' || !item.id) return;
              const timeText = item.publishTime ? ` • ${item.publishTime}` : '';
              const rel = document.createElement('div');
              rel.className = 'related-item';
              rel.onclick = () => playVideo(item.id, item.title);
              rel.innerHTML = `
                <div class="related-thumb-box">
                  <img style="width:100%; height:100%; object-fit:cover;" src="${item.thumbnail}" loading="lazy">
                  ${item.duration ? `<span class="duration-badge">${item.duration}</span>` : ''}
                </div>
                <div class="related-info">
                  <h4>${item.title}</h4>
                  <p>${item.channel || ''}</p>
                  <p>${item.views || ''}${timeText}</p>
                </div>
              `;
              relatedContainer.appendChild(rel);
            });
          }
        }).catch(e => {
          document.getElementById('relatedList').innerHTML = '';
        });
    }

    // Fungsi untuk merubah URL Iframe saat tombol Loop ditekan
    function toggleLoop() {
      setPlayerUrl();
    }

    function setPlayerUrl() {
      const isLoop = document.getElementById('loopToggle').checked;
      // Parameter YouTube Iframe murni (bebas nge-lag)
      // Jika loop aktif, YT mewajibkan parameter playlist disamakan dengan ID video
      let url = `https://www.youtube-nocookie.com/embed/${currentVideoId}?autoplay=1`;
      if (isLoop) {
        url += `&loop=1&playlist=${currentVideoId}`;
      }
      videoPlayer.src = url;
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      searchVideos(document.getElementById('searchInput').value);
    });

    window.onload = () => switchTab('search');
  </script>
</body>
</html>
