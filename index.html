<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Web Player</title>
  <style>
    :root { --bg: #0f0f0f; --card-bg: #1f1f1f; --text: #f1f1f1; --muted: #aaaaaa; --border: #303030; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Roboto, Arial, sans-serif; background-color: var(--bg); color: var(--text); }
    
    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .logo span { background: red; color: white; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    
    /* Search Box & Suggestions */
    .search-container { position: relative; flex: 1; max-width: 500px; margin: 0 16px; }
    .search-form { display: flex; width: 100%; }
    .search-form input { flex: 1; padding: 10px 14px; background: #121212; border: 1px solid var(--border); border-radius: 20px 0 0 20px; color: #fff; outline: none; }
    .search-form button { padding: 10px 18px; background: #222; border: 1px solid var(--border); border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer; }

    .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: #212121; border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; z-index: 200; max-height: 250px; overflow-y: auto; display: none; }
    .suggestion-item { padding: 10px 14px; font-size: 14px; cursor: pointer; color: #eee; }
    .suggestion-item:hover { background: #2a2a2a; }

    /* Layout Containers */
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    #loader { text-align: center; padding: 40px; color: var(--muted); display: none; }

    /* Search Results Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .video-card { display: flex; flex-direction: column; cursor: pointer; border-radius: 8px; overflow: hidden; background: transparent; transition: transform 0.2s; }
    .video-card:hover { transform: translateY(-3px); }
    
    .thumb-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #222; overflow: hidden; border-radius: 8px; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .duration-badge { position: absolute; bottom: 6px; right: 6px; background-color: rgba(0, 0, 0, 0.8); color: white; font-size: 11px; font-weight: 500; padding: 3px 6px; border-radius: 4px; line-height: 1; }
    
    .card-info { padding: 10px 0; }
    .card-title { font-size: 14px; font-weight: 600; margin: 0 0 6px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .card-meta { font-size: 12px; color: var(--muted); margin: 0; }

    /* Load More Button */
    .load-more-container { text-align: center; margin: 30px 0; }
    .load-more-btn { background: #222; color: #fff; border: 1px solid var(--border); padding: 10px 24px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .load-more-btn:hover { background: #333; }

    /* Watch Page Layout */
    #watchView { display: none; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) {
      #watchView { grid-template-columns: 1fr 350px; }
    }

    .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    .video-details { margin-top: 16px; margin-bottom: 24px; }
    .video-details h1 { font-size: 18px; margin: 0; }

    /* Related Sidebar */
    .related-title { font-size: 16px; margin: 0 0 12px 0; }
    .related-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .related-thumb-box { position: relative; width: 120px; flex-shrink: 0; }
    .related-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; background: #222; display: block; }
    .related-info { display: flex; flex-direction: column; justify-content: center; }
    .related-info h4 { font-size: 12px; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .related-info p { font-size: 11px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showSearchPage()">YT <span>STREAM</span></div>
    
    <div class="search-container">
      <form class="search-form" id="searchForm">
        <input type="text" id="searchInput" placeholder="Cari video..." autocomplete="off" required>
        <button type="submit">Cari</button>
      </form>
      <div class="suggestions-box" id="suggestionsBox"></div>
    </div>
  </header>

  <main>
    <div id="loader">Memuat data...</div>

    <div id="searchView">
      <div class="grid" id="videoGrid"></div>
      <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreVideos()">Muat Lebih Banyak</button>
      </div>
    </div>

    <div id="watchView">
      <div class="main-player-col">
        <div class="player-container">
          <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="video-details">
          <h1 id="vTitle">Memutar Video...</h1>
        </div>
      </div>

      <div class="sidebar-col">
        <h3 class="related-title">Video Terkait</h3>
        <div id="relatedList"></div>
      </div>
    </div>
  </main>

  <script>
    const searchView = document.getElementById('searchView');
    const watchView = document.getElementById('watchView');
    const loader = document.getElementById('loader');
    const videoGrid = document.getElementById('videoGrid');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestionsBox');
    const loadMoreContainer = document.getElementById('loadMoreContainer');

    let currentQuery = '';
    let nextContinuationToken = null;

    function showSearchPage() {
      watchView.style.display = 'none';
      searchView.style.display = 'block';
      document.getElementById('videoPlayer').src = '';
    }

    async function searchVideos(query, isLoadMore = false) {
      if (!isLoadMore) {
        showSearchPage();
        videoGrid.innerHTML = '';
        currentQuery = query;
        nextContinuationToken = null;
        loader.style.display = 'block';
      } else {
        document.getElementById('loadMoreBtn').innerText = "Memuat...";
      }

      try {
        let url = `/api/yt?action=search&q=${encodeURIComponent(query)}`;
        if (isLoadMore && nextContinuationToken) {
          url += `&continuation=${encodeURIComponent(nextContinuationToken)}`;
        }

        const res = await fetch(url);
        const data = await res.json();
        
        loader.style.display = 'none';
        if (isLoadMore) document.getElementById('loadMoreBtn').innerText = "Muat Lebih Banyak";

        nextContinuationToken = data.continuationToken || null;
        loadMoreContainer.style.display = nextContinuationToken ? 'block' : 'none';

        if (data.results) {
          data.results.forEach(item => {
            if (item.type !== 'video' || !item.id) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => playVideo(item.id, item.title);
            
            let metaText = item.channel || '';
            if (item.views) metaText += ` • ${item.views}`;
            if (item.published) metaText += ` • ${item.published}`;

            card.innerHTML = `
              <div class="thumb-box">
                <img src="${item.thumbnail}" loading="lazy">
                ${item.duration ? `<span class="duration-badge">${item.duration}</span>` : ''}
              </div>
              <div class="card-info">
                <h3 class="card-title">${item.title}</h3>
                <p class="card-meta">${metaText}</p>
              </div>
            `;
            videoGrid.appendChild(card);
          });
        }
      } catch (err) {
        loader.style.display = 'none';
        if (isLoadMore) document.getElementById('loadMoreBtn').innerText = "Muat Lebih Banyak";
        alert("Gagal memuat video: " + err.message);
      }
    }

    function loadMoreVideos() {
      if (nextContinuationToken) {
        searchVideos(currentQuery, true);
      }
    }

    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.trim();
      clearTimeout(debounceTimer);
      if (keyword.length < 2) {
        suggestionsBox.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(keyword)}`);
          const data = await res.json();
          const suggestions = data[1] || [];

          suggestionsBox.innerHTML = '';
          if (suggestions.length > 0) {
            suggestions.forEach(s => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = s;
              div.onclick = () => {
                searchInput.value = s;
                suggestionsBox.style.display = 'none';
                searchVideos(s);
              };
              suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
          } else {
            suggestionsBox.style.display = 'none';
          }
        } catch (err) {
          suggestionsBox.style.display = 'none';
        }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        suggestionsBox.style.display = 'none';
      }
    });

    function playVideo(videoId, title) {
      searchView.style.display = 'none';
      watchView.style.display = 'grid';
      suggestionsBox.style.display = 'none';
      window.scrollTo(0, 0);

      document.getElementById('vTitle').innerText = title || "Sedang Memutar...";
      document.getElementById('relatedList').innerHTML = "";
      document.getElementById('videoPlayer').src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0`;

      fetch(`/api/yt?action=related&id=${videoId}`)
        .then(r => r.json())
        .then(data => {
          const relatedContainer = document.getElementById('relatedList');
          if (data.results && data.results.length > 0) {
            data.results.forEach(item => {
              if (item.type !== 'video' || !item.id) return;
              const rel = document.createElement('div');
              rel.className = 'related-item';
              rel.onclick = () => playVideo(item.id, item.title);
              
              let relMeta = item.channel || '';
              if (item.views) relMeta += ` • ${item.views}`;
              if (item.published) relMeta += ` • ${item.published}`;

              rel.innerHTML = `
                <div class="related-thumb-box">
                  <img class="related-thumb" src="${item.thumbnail}" loading="lazy">
                  ${item.duration ? `<span class="duration-badge">${item.duration}</span>` : ''}
                </div>
                <div class="related-info">
                  <h4>${item.title}</h4>
                  <p>${relMeta}</p>
                </div>
              `;
              relatedContainer.appendChild(rel);
            });
          } else {
            relatedContainer.innerHTML = '<p style="font-size: 12px; color: var(--muted);">Video terkait tidak tersedia.</p>';
          }
        }).catch(e => {
          console.error("Gagal memuat video terkait:", e);
        });
    }

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      suggestionsBox.style.display = 'none';
      searchVideos(searchInput.value);
    });

    window.onload = () => searchVideos('musik indonesia terbaru');
  </script>
</body>
</html>
